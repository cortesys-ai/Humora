login_endpoint:
  tags:
    - Authentication
  summary: User Login
  parameters:
    - name: body
      in: body
      required: true
      schema:
        type: object
        properties:
          username:
            type: string
            example: johndoe
          password:
            type: string
            example: secret123
  responses:
    200:
      description: Successfully logged in
    401:
      description: Invalid credentials

register_endpoint:
  tags:
    - Authentication
  summary: User Registration
  parameters:
    - name: body
      in: body
      required: true
      schema:
        type: object
        properties:
          email:
            type: string
            example: john@example.com
          username:
            type: string
            example: johndoe
          password:
            type: string
            example: secret123
  responses:
    201:
      description: User registered successfully