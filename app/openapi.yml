paths:
  /auth/login:
    post:
      tags:
        - Authentication
      summary: User Login
      parameters:
        - name: body
          in: body
          required: true
          schema:
            type: object
            properties:
              username:
                type: string
              password:
                type: string
      responses:
        200:
          description: Logged in successfully

  /api/auth/user:
    get:
      tags:
        - User
      summary: Get User Details
      parameters:
        - name: uuid
          in: query          # GET requests should use query or path params, not body
          type: string
      responses:
        200:
          description: User details retrieved successfully

    post:
      tags:
        - User
      summary: Create User
      parameters:
        - name: body
          in: body
          required: true
          schema:
            type: object
            properties:
              name:
                type: string
              password:
                type: string
              email:
                type: string
              role:
                type: integer
      responses:
        201:
          description: User created successfully

    put:
      tags:
        - User
      summary: Update User
      parameters:
        - name: body
          in: body
          required: true
          schema:
            type: object
            properties:
              name:
                type: string
              password:
                type: string
              email:
                type: string
              role:
                type: integer
      responses:
        200:
          description: User updated successfully

    delete:
      tags:
        - User
      summary: Delete User
      parameters:
        - name: uuid
          in: query          # Or pass in path /api/auth/user/{uuid}
          required: true
          type: string
      responses:
        200:
          description: User deleted successfully