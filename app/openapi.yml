swagger: "2.0"
info:
  title: User & Auth API
  version: "1.0"

# 1. Define the Bearer token security scheme
securityDefinitions:
  BearerAuth:
    type: apiKey
    name: Authorization
    in: header
    description: "Enter your token in the format: Bearer <JWT-token>"

paths:
  /api/auth/login:
    post:
      tags:
        - Authentication
      summary: User Login
      parameters:
        - name: body
          in: body
          required: true
          schema:
            type: object
            properties:
              email:
                type: string
              password:
                type: string
      responses:
        200:
          description: Logged in successfully

  /api/auth/user:
    get:
      tags:
        - User
      summary: Get User Details
      security:
        - BearerAuth: []     # Requires Authorization header
      parameters:
        - name: uuid
          in: query
          type: string
      responses:
        200:
          description: User details retrieved successfully
        401:
          description: Unauthorized / Missing or Invalid Token

    post:
      tags:
        - User
      summary: Create User
      security:
        - BearerAuth: []     # Requires Authorization header
      parameters:
        - name: body
          in: body
          required: true
          schema:
            type: object
            properties:
              name:
                type: string
              password:
                type: string
              email:
                type: string
              role:
                type: integer
      responses:
        201:
          description: User created successfully
        401:
          description: Unauthorized / Missing or Invalid Token

    put:
      tags:
        - User
      summary: Update User
      security:
        - BearerAuth: []     # Requires Authorization header
      parameters:
        - name: body
          in: body
          required: true
          schema:
            type: object
            properties:
              name:
                type: string
              password:
                type: string
              email:
                type: string
              role:
                type: integer
      responses:
        200:
          description: User updated successfully
        401:
          description: Unauthorized / Missing or Invalid Token

    delete:
      tags:
        - User
      summary: Delete User
      security:
        - BearerAuth: []     # Requires Authorization header
      parameters:
        - name: uuid
          in: query
          required: true
          type: string
      responses:
        200:
          description: User deleted successfully
        401:
          description: Unauthorized / Missing or Invalid Token